<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas (CRUD)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Gestor de Tareas</h1>
    <form id="task-form">
      <input id="title" placeholder="Título">
      <input id="description" placeholder="Descripción">
      <select id="status">
        <option>Pendiente</option>
        <option>En progreso</option>
        <option>Completada</option>
      </select>
      <button id="submit-btn" type="submit">Agregar</button>
      <p id="error" class="error"></p>
    </form>
    <table>
      <thead><tr><th>Título</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="task-body"></tbody>
    </table>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/list.js"></script>
  <script src="js/create.js"></script>
  <script src="js/edit.js"></script>
  <script src="js/delete.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
